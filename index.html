<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Простой Загрузчик Файлов</title>
    <style>
        body {
            background: #0a0a0a;
            color: #00ff88;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #00ff88;
            border-radius: 10px;
        }
        .input-group {
            margin: 20px 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 1px solid #00ff88;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        button {
            background: #00ff88;
            color: black;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #00cc66;
        }
        .log {
            background: #000;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 15px;
            margin-top: 20px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }
        .progress {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: #00ff88;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Простой Загрузчик Файлов</h1>
            <p>Вставьте ссылку на файл и нажмите "Скачать"</p>
        </div>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://example.com/file.zip">
            <div>
                <button onclick="startDownload()">📥 Скачать файл</button>
                <button onclick="testButton()">🧪 Тест кнопки</button>
                <button onclick="clearLog()">🗑️ Очистить лог</button>
            </div>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        // Простой логгер
        function log(message, type = 'info') {
            const logElement = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff4444' : 
                         type === 'success' ? '#00ff88' : '#ffffff';
            
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<span style="color: ${color}">[${timestamp}] ${message}</span>`;
            logElement.appendChild(logEntry);
            logElement.scrollTop = logElement.scrollHeight;
            
            console.log(message);
        }

        // Тестовая функция для проверки кнопок
        function testButton() {
            log('✅ Кнопка работает! JavaScript активен', 'success');
            updateProgress(50);
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            updateProgress(0);
            log('Лог очищен', 'info');
        }

        function updateProgress(percent) {
            const progressBar = document.getElementById('progressBar');
            if (progressBar) {
                progressBar.style.width = percent + '%';
            }
        }

        // Основная функция скачивания
        async function startDownload() {
            const urlInput = document.getElementById('urlInput');
            const url = urlInput.value.trim();
            
            if (!url) {
                log('❌ Введите URL для скачивания', 'error');
                return;
            }

            log(`📥 Начинаю загрузку: ${url}`, 'info');
            updateProgress(10);

            try {
                // Используем CORS прокси для обхода блокировок
                const proxyUrls = [
                    'https://corsproxy.io/?',
                    'https://api.allorigins.win/raw?url=',
                    'https://cors-anywhere.herokuapp.com/'
                ];

                let success = false;
                
                for (const proxy of proxyUrls) {
                    try {
                        log(`🔄 Пробую прокси: ${proxy}`, 'info');
                        const proxyUrl = proxy + encodeURIComponent(url);
                        
                        const response = await fetch(proxyUrl);
                        
                        if (response.ok) {
                            log('✅ Прокси работает! Загружаю файл...', 'success');
                            updateProgress(30);
                            
                            const blob = await response.blob();
                            updateProgress(70);
                            
                            // Создаем ссылку для скачивания
                            const downloadUrl = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = downloadUrl;
                            a.download = getFilenameFromUrl(url) || 'download.file';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            URL.revokeObjectURL(downloadUrl);
                            
                            log(`💾 Файл сохранен: ${a.download}`, 'success');
                            updateProgress(100);
                            success = true;
                            break;
                        }
                    } catch (error) {
                        log(`❌ Прокси не сработал: ${error.message}`, 'error');
                        continue;
                    }
                }
                
                if (!success) {
                    log('💥 Все прокси не сработали. Попробуйте другой URL.', 'error');
                    updateProgress(0);
                }
                
            } catch (error) {
                log(`💥 Ошибка: ${error.message}`, 'error');
                updateProgress(0);
            }
        }

        function getFilenameFromUrl(url) {
            try {
                const urlObj = new URL(url);
                const pathname = urlObj.pathname;
                return pathname.split('/').pop() || null;
            } catch {
                return null;
            }
        }

        // Авто-тест при загрузке
        window.onload = function() {
            log('🚀 Загрузчик активирован!', 'success');
            log('💡 Введите URL файла и нажмите "Скачать файл"', 'info');
            
            // Тестовые URL для быстрой проверки
            document.getElementById('urlInput').value = 'https://httpbin.org/bytes/102400'; // 100KB тестовый файл
        };

        // Обработка Enter в поле ввода
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                startDownload();
            }
        });
    </script>
</body>
</html>
